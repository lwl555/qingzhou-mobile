name: 编译安卓 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 提供 Android SDK，用于 gradle 编译
      - uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install

      - name: 生成安卓工程
        run: npx cap add android || true

      - name: 同步网页到安卓工程
        run: npx cap sync android

      # 手机上要直连电脑的 http://192.168.x.x:8787，必须允许明文流量，
      # 否则 Android 9+ 默认禁止，局域网模式会连不上
      - name: 允许明文 HTTP
        run: sed -i 's|<application |<application android:usesCleartextTraffic="true" |' android/app/src/main/AndroidManifest.xml

      - name: 编译 Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qingzhou-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
