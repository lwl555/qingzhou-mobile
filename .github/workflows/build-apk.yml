name: 编译安卓 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 注：GitHub 的 ubuntu 镜像自带 Android SDK（ANDROID_HOME），
      # 不需要再装；之前用的 android-actions/setup-android 已不可用，故去掉。

      - name: 安装依赖
        run: npm install

      - name: 生成安卓工程
        run: npx cap add android || true

      - name: 同步网页到安卓工程
        run: npx cap sync android

      # gradle 需要知道 SDK 在哪
      - name: 指定 SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties || true

      - name: 接受 Android 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # 手机上要直连电脑的 http://192.168.x.x:8787，必须允许明文流量，
      # 否则 Android 9+ 默认禁止，局域网模式会连不上
      - name: 允许明文 HTTP
        run: sed -i 's|<application |<application android:usesCleartextTraffic="true" |' android/app/src/main/AndroidManifest.xml

      # 语音输入（左下角麦克风）：声明录音权限。@capacitor-community/speech-recognition
      # 的库清单一般会合并进来，这里再显式声明一次，双保险。
      - name: 声明录音权限
        run: sed -i 's|<application |<uses-permission android:name="android.permission.RECORD_AUDIO" /><application |' android/app/src/main/AndroidManifest.xml

      # 状态栏通知（App 原生推送）：Android 13+ 必须声明 POST_NOTIFICATIONS 才会弹权限框；
      # SCHEDULE_EXACT_ALARM 让"到点提醒"能准点触发。
      - name: 声明通知权限
        run: sed -i 's|<application |<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /><uses-permission android:name="android.permission.WAKE_LOCK" /><application |' android/app/src/main/AndroidManifest.xml

      - name: 编译 Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qingzhou-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
