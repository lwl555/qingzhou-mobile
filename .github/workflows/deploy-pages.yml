name: 同步手机版网页到 gh-pages

# 把 mobile/ 目录同步到 gh-pages 分支；GitHub Pages 以该分支为源对外提供网页。
# 之所以不用 actions/deploy-pages：那需要 Pages 设为 workflow 模式，会和分支模式冲突。

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 发布 mobile/ 到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mobile
          publish_branch: gh-pages
