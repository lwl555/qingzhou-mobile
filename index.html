<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轻舟</title>
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="hd">
  <div class="hd-txt" style="flex:1;min-width:0">
    <div class="hd-title">轻舟</div>
    <div class="hd-sub"><span class="dot" id="dot"></span><span id="statText">检测中…</span></div>
  </div>
  <button class="hd-btn" id="cfgBtn">连接</button>
</header>

<div class="wrap" id="wrap">
  <div class="empty" id="empty">
    <div class="hi" id="hi">你好</div>
    <p class="hi-sub">在家连你电脑用本地模型，出门自动走云端。</p>
    <div class="chips" id="list"></div>
    <p class="privacy">数据默认留在本机，连不上电脑才走云端。连上电脑还能用本地文件、直接操作桌面。</p>
  </div>
  <div class="msgs" id="msgs"></div>
</div>

<div class="composer">
  <button class="ic" id="micBtn" type="button" aria-label="语音输入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
  </button>
  <button class="ic" id="attBtn" type="button" aria-label="添加图片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <input id="fileInput" type="file" accept="image/*" hidden>
  <div class="field">
    <textarea id="txt" rows="1" placeholder="说点什么"></textarea>
  </div>
  <button class="send" id="send">发送</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <div class="sheet-bar"></div>
    <h3>连接电脑</h3>
    <p class="tip">手机和电脑在同一个 Wi-Fi 时填它的局域网地址，之后打开就自动直连，能用电脑上的模型、文件和工具。</p>
    <input id="ipInput" placeholder="例如 192.168.1.5" inputmode="numeric">
    <div class="row">
      <button id="scanBtn">扫描</button>
      <button id="saveBtn" class="primary">连接</button>
    </div>
    <div class="scanlog" id="scanLog"></div>

    <h3 style="margin-top:18px">远程（在外面连电脑）</h3>
    <p class="tip">先在电脑上打开「远程操作」，会显示一个本机号码；把号码填到这里，之后在外面也能直接操作那台电脑。</p>
    <input id="pcIdInput" placeholder="例如 A3F9K2" autocapitalize="characters">
    <div class="row">
      <button id="remoteBtn" class="primary">连远程</button>
    </div>

    <h3 style="margin-top:18px">模型</h3>
    <p class="tip" id="modelTip">云端模式用在线模型；连上电脑后可用你电脑上的模型。</p>
    <select id="modelSel"></select>

    <h3 style="margin-top:18px">电脑上的会话</h3>
    <p class="tip">远程连上电脑后，可以在这里读电脑上存的历史对话，点一条就在上面打开。</p>
    <button id="histBtn" style="width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:11px;font-size:14px;min-height:44px">读取电脑上的会话</button>
    <div class="scanlog" id="histLog"></div>
    <div class="histlist" id="histList"></div>

    <p class="tip2">不填也能用：连不上电脑时会自动用云端模型。</p>
    <button class="close" id="closeSheet">关闭</button>
  </div>
</div>

<!-- 远程功能需要用到实时通道组件；加载失败也不影响局域网和云端两种模式 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
